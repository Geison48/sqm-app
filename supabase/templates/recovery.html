<!-- Template bilíngue: o idioma vem de user_metadata.language. -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; color: #171717;">
  <h2 style="margin-bottom: 4px;">SQM App</h2>
  {{ if eq .Data.language "en" }}
  <p>We received a request to reset your password.</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display: inline-block; padding: 10px 18px; background: #171717; color: #ffffff; text-decoration: none; border-radius: 6px;">Set a new password</a></p>
  <p style="color: #737373; font-size: 13px;">If you did not request this, ignore this email.</p>
  {{ else }}
  <p>Recebemos um pedido para redefinir sua senha.</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display: inline-block; padding: 10px 18px; background: #171717; color: #ffffff; text-decoration: none; border-radius: 6px;">Definir nova senha</a></p>
  <p style="color: #737373; font-size: 13px;">Se você não fez este pedido, ignore este e-mail.</p>
  {{ end }}
</div>
